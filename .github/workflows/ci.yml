name: CI

# The type check and the unit tests run on every push and pull request, so a
# change that breaks either is seen straight away (the no-runtime-AI scan has
# its own workflow, no-runtime-ai.yml). Tests are offline: no database, no
# network, no AI.

on:
  push:
    branches: [main, runlogtest, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test
