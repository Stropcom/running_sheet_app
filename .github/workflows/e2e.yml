name: E2E smoke tests

# Drives the real app in a real browser (Playwright) against a throwaway MySQL
# database: sign in, create an operation and a running sheet, add and certify a
# row, and open the main pages. The unit tests in ci.yml never load a page, so
# this is what catches a screen that no longer opens. Nothing here calls out to
# an external AI or any other outside service.

on:
  push:
    branches: [main, runlogtest, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: runlog_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/runlog_e2e
      VITE_APP_ID: e2e-app
      JWT_SECRET: e2e-only-secret-not-used-anywhere-else
      PORT: "3000"
      E2E_USERNAME: e2e
      E2E_PASSWORD: E2e-Passw0rd!
      E2E_CIN: E2E1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--with-deps` also runs apt to add system packages and fonts. When the
      # runner cannot reach the Ubuntu package servers (it happened on
      # 2026-11-11: "Temporary failure resolving 'security.ubuntu.com'") that
      # step hung for ten minutes and failed before any test ran. So: give it a
      # short time, try it up to three times, and if it still cannot, install
      # just the browser (the runner image already has the system libraries
      # Chromium needs; a missing one fails loudly when the browser starts).
      - name: Install the test browser
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 150 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install --with-deps failed or timed out (attempt $attempt)"
          done
          echo "Installing the browser without the apt step"
          for attempt in 1 2 3; do
            if timeout 180 pnpm exec playwright install chromium; then
              exit 0
            fi
            echo "playwright install chromium failed or timed out (attempt $attempt)"
          done
          exit 1

      - name: Create the database tables
        run: pnpm exec drizzle-kit migrate

      - name: Check the migrations build the same database as schema.ts
        run: pnpm tsx scripts/dev/check-schema-drift.ts

      - name: Create the test officer
        run: pnpm tsx scripts/dev/create-admin-user.ts "$E2E_USERNAME" "$E2E_PASSWORD" "E2E Officer" "$E2E_CIN"

      - name: Copy the browser engine files (what `pnpm dev` does first)
        run: pnpm tsx scripts/dev/copy-onnx-wasm.ts

      - name: Start the app
        run: |
          NODE_ENV=development nohup pnpm exec tsx server/_core/index.ts > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null; then echo "app is up"; exit 0; fi
            sleep 2
          done
          echo "app did not start"; cat app.log; exit 1

      - name: Run the smoke tests
        run: pnpm test:e2e

      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            test-results/
            app.log
          retention-days: 7
